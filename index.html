<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LitShelf – Books Marketplace</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>" />
</head>
<body>
  <div id="authPage" class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">📖</div>
      <h1>LitShelf</h1>
      <p class="tag">Independent booksellers · One marketplace</p>
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="tabLogin" onclick="showTab('login')">Login</button>
        <button type="button" class="auth-tab" id="tabSignup" onclick="showTab('signup')">Sign Up</button>
      </div>
      <form id="loginForm">
        <div class="form-group"><label>Email</label><input type="email" id="loginEmail" required placeholder="customer@litshelf.com" /></div>
        <div class="form-group"><label>Password</label><input type="password" id="loginPassword" required /></div>
        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>
      <form id="signupForm" class="hidden">
        <div class="form-group"><label>Full Name</label><input type="text" id="suName" required /></div>
        <div class="form-group"><label>Email</label><input type="email" id="suEmail" required /></div>
        <div class="form-group"><label>Password</label><input type="password" id="suPass" required minlength="4" /></div>
        <div class="form-group"><label>I am a</label>
          <select id="suRole">
            <option value="customer">Customer (buy books)</option>
            <option value="seller">Seller (list & sell books)</option>
          </select>
        </div>
        <div class="form-group hidden" id="suShopWrap"><label>Shop name</label><input type="text" id="suShop" placeholder="My Book Shop" /></div>
        <button type="submit" class="btn btn-primary">Create Account</button>
      </form>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="side-brand">
        <div class="mark">📖</div>
        <div><h2>LitShelf</h2><span>Books only</span></div>
      </div>
      <nav class="side-nav" id="nav"></nav>
      <div class="side-foot">
        <div class="user-chip">
          <div class="avatar" id="av">LS</div>
          <div><div id="un" style="font-size:13px;font-weight:600">User</div><div id="ur" style="font-size:11px;color:var(--muted)">role</div></div>
        </div>
        <button class="btn btn-ghost btn-sm" style="width:100%" onclick="logout()">Logout</button>
      </div>
    </aside>
    <main class="main"><div id="page"></div></main>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast hidden"></div>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
